<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    width: 100%;

}
body{
    display: flex;
    
}
canvas {
    
    flex: 3;
    min-width: 0;
    display: block;
    
}
aside{
     /* height: 100%;
    flex: 1;
    background-color: aliceblue; */
    position: absolute;
    top: 16px;
    left: 16px;
    width: 200px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-radius: 12px;
   
}
aside h1{
    margin: 0;
    font-size: 1.2rem;
}
aside input[type='color'], aside input[type='range']{
    width: 100%;
    cursor: pointer;
}
button {
    border-radius: 10px;
    padding: 8px;
    border: none;
    background: #4f46e5;
    color: white;
    font-weight: 600;
    cursor: pointer;
}
button:hover{
    background: #4338ca;
}
#clear{
    background: #dc2626;
}
#clear:hover{
    background: #b91c1c;
}
    </style>
</head>
<body>
    <aside>
        <h1>pick a ball</h1>
        <input type="color" id="colorPicker">
        <label for="size">pick a size</label>
        <input id="size" type="range" min="10" max="150" step="20">
        <button id="addBall" class="ballAdder">add selected ball</button>
        <button id="addRandom" class="ballAdder">add random ball</button>
        <button id="addDvd">add dvd logo</button>
        <label for="checkbox">change color on bounce</label>
        <input type="checkbox" name="" id="checkbox" checked>
        <button id="clear">clear</button>
    </aside>
    <canvas id="theCanvas"></canvas>
    <script src="scripts/ball.js" type="module"></script>
</body>
</html>
