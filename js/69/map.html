<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body {
            margin-top: 5%;
            margin-left: 5%;
            margin-right: 5%;
            display: flex;
            padding: 20px;
            gap: 20px;
            background: #f5f5f5;
            color: #292929;
            font-family: Arial, sans-serif;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        #sidebar{
            width: 280px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 18px;
            background: #ffffff;
            border: 1px solid #e3e3df;
            border-radius: 8px;
        }
        #sidebar > div:first-child{
            display: flex;
            gap: 8px;
        }
        #map {
            flex: 1;
            min-width: 0;
            border-radius: 8px;
            height: 100%;
            border: 1px solid #e3e3df;
            overflow: hidden;
        }



        #input {
            width: 100%;
            min-width: 0;
            padding: 10px;
            border: 1px solid #d5d5d0;
            border-radius: 5px;
            background: #fff;
            color: #292929;
            font-size: 14px;
        }

        #input:focus{
            outline: 1px solid #777;
        }

        #search{
            padding: 10px 13px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #333;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        #search:hover{
            background: #4a4a4a;
        }

        #places{
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #places li{
            padding: 12px 10px;
            border-bottom: 1px solid #ededeb;
            font-size: 14px;
            line-height: 1.4;
            cursor: pointer;
        }

        #places li:hover{
            background: #f3f3f0;
        }

        .map-icon {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }

        .place-info{
            max-width: 260px;
            padding: 4px 2px;
            color: #292929;
            font-family: Arial, sans-serif;
        }

        .place-info h3{
            margin: 0 0 8px;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
        }

        .place-info p{
            margin: 0 0 12px;
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }

        .place-info a{
            color: #315f78;
            font-size: 13px;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <aside id=sidebar>
        <div><input type="text" placeholder="search for a place" id="input">
            <button id="search">search</button>
        </div>
        <div name="" id="places">

        </div>
        <button id="clearButton">Clear</button>
    </aside>
    <div id="map"></div>
    <script src="config.js">
    </script>
    


</body>

</html>
