<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0;
        width: 100%;
        height: 100%;
        
    }
    #theCanvas{
        display: block;
        border: 1px solid black;
        box-sizing: border-box;
        position: absolute;
    }
    #stopb{
        position: absolute;
    }
    #popup{
        display: flex;
        justify-content: center;
        align-items: center;
        visibility:hidden;
        position: absolute;
        top: 40%;
        left: 40%;
        background-color: aqua;
        width: 20%;
        height: 20%;
        text-align: center;
        line-height: 100%;
        border-radius: 10px;
    }
    div h2{
        display: inline-block;
        vertical-align: middle;
    }
</style>
<body>
    <div id='background'></div>
    <canvas id="theCanvas"></canvas>
    <div id="popup"> <h2 id="popupText"></h2></div>
    <script src="scripts/snake.js" type="module"></script>

</body>
</html>
